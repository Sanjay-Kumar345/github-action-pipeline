name: Terraform Multi Stage Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  ARM_CLIENT_ID: ${{secrets.ARM_CLIENT_ID}}
  ARM_CLIENT_SECRET: ${{secrets.ARM_CLIENT_SECRET}}
  ARM_SUBSCRIPTION_ID: ${{secrets.ARM_SUBSCRIPTION_ID}}
  ARM_TENANT_ID: ${{secrets.ARM_TENANT_ID}}

jobs:

  # ==========================
  # Stage 1 - INIT
  # =========================

  terraform-init:

    name: Terraform Init

    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform -chdir=./Environement/UAT init


  # =========================
  # Stage 2 - VALIDATE
  # =========================

  terraform-validate:

    name: Terraform Validate

    needs: terraform-init

    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform -chdir=./Environement/UAT init

      - name: Terraform Validate
        run: terraform -chdir=./Environement/UAT validate


  # =========================
  # Stage 3 - PLAN
  # =========================

  terraform-plan:

    name: Terraform Plan

    needs: terraform-validate

    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform -chdir=./Environement/UAT init

      - name: Terraform Plan
        run: terraform -chdir=./Environement/UAT plan


  # =========================
  # Stage 4 - APPLY
  # =========================

  terraform-apply:

    name: Terraform Apply

    needs: terraform-plan 

    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform -chdir=./Environement/UAT init
      - name: Terraform Apply
        run: terraform -chdir=./Environement/UAT apply -auto-approve


