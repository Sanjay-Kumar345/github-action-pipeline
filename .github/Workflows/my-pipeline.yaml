name: Terraform Multi Stage Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  ARM_CLIENT_ID: ${{vars.ARM_CLIENT_ID}}
  ARM_CLIENT_SECRET: ${{vars.ARM_CLIENT_SECRET}}
  ARM_SUBSCRIPTION_ID: ${{vars.ARM_SUBSCRIPTION_ID}}
  ARM_TENANT_ID: ${{vars.ARM_TENANT_ID}}

jobs:

  # =========================
  # Stage 1 - INIT
  # =========================

  terraform-init:

    name: Terraform Init

    runs-on: [self-hosted, action-runner]

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init


  # =========================
  # Stage 2 - VALIDATE
  # =========================

  terraform-validate:

    name: Terraform Validate

    needs: terraform-init

    runs-on: [self-hosted, action-runner]

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate


  # =========================
  # Stage 3 - PLAN
  # =========================

  terraform-plan:

    name: Terraform Plan

    needs: terraform-validate

    runs-on: [self-hosted, action-runner]

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan


  # =========================
  # Stage 4 - APPLY
  # =========================

  terraform-apply:

    name: Terraform Apply

    needs: terraform-plan

    runs-on: [self-hosted, action-runner]

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -auto-approve

             
